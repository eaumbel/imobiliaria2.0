<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imobiliária 2.0 Gestão Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  /* Layout: menu lateral fixo + área de trabalho em grade de cartões; no celular vira barra superior com gaveta */
  /* Paleta da marca: vermelho da logo, prata/aço e grafite */
  --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f6f7f8; --ink:#16181b; --muted:#5d636b;
  --line:#e0e3e7; --line-strong:#c5cad0;
  --accent:#b5121b; --accent-ink:#ffffff; --accent-soft:#fbe6e7;
  --gold:#6f7a85; --gold-soft:#eceff2;
  --side:#141619; --side-2:#24282d; --side-ink:#dde1e5; --side-muted:#8a9199;
  --ok:#1b8749; --ok-soft:#e1f2e7; --warn:#b06f06; --warn-soft:#faeed6; --bad:#c2410c; --bad-soft:#fdebe0; --info:#2d64a8; --info-soft:#e3ecf7;
  --font-display:"Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(20,22,25,.05), 0 8px 24px -16px rgba(20,22,25,.22);
  --shadow-lg:0 24px 60px -20px rgba(10,20,28,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1012; --surface:#17191c; --surface-2:#1e2125; --ink:#e8eaed; --muted:#9aa1a9;
    --line:#2a2e33; --line-strong:#3c4148;
    --accent:#e5383f; --accent-ink:#ffffff; --accent-soft:#3b1416;
    --gold:#aeb6bf; --gold-soft:#262a2f;
    --side:#0b0c0e; --side-2:#1d2024; --side-ink:#dde1e5; --side-muted:#868d95;
    --ok:#4cc27e; --ok-soft:#163a26; --warn:#e2a23a; --warn-soft:#3b2f17; --bad:#f2843f; --bad-soft:#3a2214; --info:#6fa2e6; --info-soft:#1b2c42;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#17191c; --surface-2:#1e2125; --ink:#e8eaed; --muted:#9aa1a9;
  --line:#2a2e33; --line-strong:#3c4148;
  --accent:#e5383f; --accent-ink:#ffffff; --accent-soft:#3b1416;
  --gold:#aeb6bf; --gold-soft:#262a2f;
  --side:#0b0c0e; --side-2:#1d2024; --side-ink:#dde1e5; --side-muted:#868d95;
  --ok:#4cc27e; --ok-soft:#163a26; --warn:#e2a23a; --warn-soft:#3b2f17; --bad:#f2843f; --bad-soft:#3a2214; --info:#6fa2e6; --info-soft:#1b2c42;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.brand-mark{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#e4e7ea 70%);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.brand-mark img{width:34px;height:34px;display:block}
.login-brand .brand-mark{width:64px;height:64px}
.login-brand .brand-mark img{width:50px;height:50px}
.brand b{font-family:var(--font-display);font-size:15.5px;display:block;color:#fff;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:16px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:14.5px;transition:background .15s}
.nav a svg{width:19px;height:19px;flex:none;opacity:.75}
.nav a:hover{background:var(--side-2)}
.nav a[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 #e5383f}
.nav a[aria-current="page"] svg{opacity:1;color:#ff5a60}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--side-2);font-size:12.5px;color:var(--side-muted);display:flex;gap:9px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);flex:none}
.dot.on{background:#4cc27e;box-shadow:0 0 0 3px rgba(76,194,126,.2)}
.dot.local{background:var(--gold)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:22px 32px 6px}
.topbar h1{font-size:25px}
.topbar .sub{color:var(--muted);font-size:14px;margin-top:3px}
.topbar .grow{flex:1}
.btn.menu-btn{display:none}
#view{padding:18px 32px 48px;display:flex;flex-direction:column;gap:20px}

/* ---------- Components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 20px 0;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:16px}
.card-h .hint{color:var(--muted);font-size:13px}
.card-b{padding:16px 20px 20px}
.grow{flex:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:15px;margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.icon{width:36px;padding:0;height:36px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{white-space:nowrap;border:0;background:transparent;padding:6px 13px;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--ink)}
.field .help{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{height:42px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:0 12px;width:100%;min-width:0;transition:border-color .15s, box-shadow .15s}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.sm{height:34px;font-size:13.5px;border-radius:8px;padding:0 9px}
.input.err{border-color:var(--bad)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.span-2{grid-column:span 2}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}

.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:none;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:12px;color:var(--muted)}
.who .avatar,.avatar{display:grid;font-size:12.5px;color:#fff}
.split > *{min-width:0}
.who b + span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t.vis{min-width:880px}
table.t.vis td{white-space:nowrap}
.tbl-wrap{overflow-x:auto}

/* switch */
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:700}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:38px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + i{background:var(--ok)}
.switch input:checked + i::after{transform:translateX(16px)}
.switch input:focus-visible + i{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- Dashboard ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:22px 24px}
.ring{position:relative;width:168px;height:168px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--font-display);font-size:34px;line-height:1}
.ring .c span{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.goal-eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.goal h2{font-size:15px;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-top:4px}
.goal .big{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.goal .of{color:var(--muted);font-size:14px}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mini span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.mini b{font-size:15px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lbl svg{width:16px;height:16px;color:var(--accent)}
.kpi .val{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi .foot{font-size:12.5px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row{display:grid;grid-template-columns:210px 1fr 92px;gap:14px;align-items:center}
.bar-track{position:relative;height:14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.bar-fill.over{background:linear-gradient(90deg,var(--accent),var(--ok))}
.bar-meta{position:absolute;top:-5px;bottom:-5px;width:2.5px;background:var(--ink);border-radius:2px}
.bar-pct{text-align:right;font-weight:800;font-size:14px}
.bar-pct small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.bar-row.sel .who b{color:var(--accent)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.funnel{display:flex;flex-direction:column;gap:11px}
.fn{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.fn .tr{height:26px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.fn .fi{height:100%;border-radius:7px}
.fn b{text-align:right}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:560px;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}

/* ---------- Calendar ---------- */
.split{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.cal{padding:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-family:var(--font-display);font-size:15px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-g .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:800;padding:4px 0;text-transform:uppercase}
.cal-g button{aspect-ratio:1;border:0;background:transparent;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;position:relative;display:grid;place-items:center;color:var(--ink)}
.cal-g button:hover{background:var(--surface-2)}
.cal-g button.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-g button.sel{background:var(--accent);color:var(--accent-ink)}
.cal-g button .mk{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal-g button .mk i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-g button.sel .mk i{background:var(--accent-ink)}
.cal-g .blank{aspect-ratio:1}

.ev{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);align-items:start;border-left:4px solid var(--accent)}
.ev .tm{font-family:var(--font-display);font-weight:700;font-size:15px}
.ev .tm small{display:block;color:var(--muted);font-weight:600;font-family:var(--font-body);font-size:12px}
.ev h4{font-size:15px;margin-bottom:3px}
.ev .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.ev .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.day-title{font-family:var(--font-display);font-size:18px}
.list{display:flex;flex-direction:column;gap:10px}

/* ---------- Ponto ---------- */
.status-tg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.status-tg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.status-tg button + button{border-left:1px solid var(--line-strong)}
.status-tg button.on-veio{background:var(--ok-soft);color:var(--ok)}
.status-tg button.on-nao{background:var(--bad-soft);color:var(--bad)}
.roleta{width:70px;text-align:center}
.h12{display:inline-flex;gap:4px;align-items:center}
.h12 button{height:34px;min-width:44px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);font-weight:800;font-size:12px;cursor:pointer;color:var(--ink)}
.h12 button[data-v="PM"]{background:var(--gold-soft);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.sum-chips{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Knowledge ---------- */
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.kb{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;border:1px solid var(--line);transition:border-color .15s, transform .15s}
.kb:hover{border-color:var(--accent);transform:translateY(-2px)}
.kb h3{font-size:16px}
.kb .branches{display:flex;flex-wrap:wrap;gap:6px}
.kb .foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12.5px;color:var(--muted)}
.kb .icon-node{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.kb .icon-node svg{width:20px;height:20px}
.kb.new{border:1.5px dashed var(--line-strong);background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:180px;color:var(--muted);font-weight:700}
.kb.new:hover{color:var(--accent)}

.org-wrap{overflow-x:auto;padding:8px 4px 16px}
.org{display:flex;justify-content:center;min-width:max-content}
.org ul{padding:20px 0 0;margin:0;position:relative;display:flex;justify-content:center}
.org > ul{padding-top:0}
.org li{list-style:none;position:relative;padding:20px 7px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;border-top:1.5px solid var(--line-strong);width:50%;height:20px}
.org li::after{right:auto;left:50%;border-left:1.5px solid var(--line-strong)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:1.5px solid var(--line-strong);border-radius:0 8px 0 0}
.org li:first-child::after{border-radius:8px 0 0 0}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:1.5px solid var(--line-strong);width:0;height:20px}
.org > ul > li{padding-top:0}
.org > ul > li::before,.org > ul > li::after{display:none}
.node{display:inline-block;padding:8px 13px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line-strong);font-size:13px;font-weight:700;max-width:180px;white-space:normal;line-height:1.3}
.node.root{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:14px;padding:10px 16px}
.node.l1{border-color:var(--gold);background:var(--gold-soft)}
.tree-ed{display:flex;flex-direction:column;gap:6px}
.tree-row{display:flex;gap:6px;align-items:center}
.tree-row .bullet{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.tree-row.d2 .bullet,.tree-row.d3 .bullet,.tree-row.d4 .bullet{background:var(--line-strong)}

/* ---------- Treinamentos ---------- */
.tr-card{display:grid;grid-template-columns:52px 1fr auto;gap:16px;padding:18px 20px;align-items:start}
.tr-ic{width:52px;height:52px;border-radius:13px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.tr-ic svg{width:26px;height:26px}
.tr-card h3{font-size:16.5px;margin-bottom:4px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.file{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);max-width:100%}
.file:hover{border-color:var(--accent)}
.file svg{width:16px;height:16px;color:var(--accent);flex:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(620px,100%);border:1px solid var(--line)}
.modal.wide{width:min(1060px,100%)}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.modal-h h2{font-size:19px;flex:1}
.modal-b{padding:18px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 20px;flex-wrap:wrap}
.modal-f .left{margin-right:auto}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);max-width:360px;border-left:4px solid var(--ok)}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.banner svg{width:18px;height:18px;color:var(--gold);flex:none}

.tabs-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

[hidden]{display:none!important}
/* ---------- Login ---------- */
#login-root{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(900px 520px at 15% -10%, #4a0d12 0%, transparent 60%),radial-gradient(700px 500px at 110% 110%, #2e3338 0%, transparent 55%),var(--side)}
.login-wrap{width:min(430px,100%);display:flex;flex-direction:column;gap:18px}
.login-brand{display:flex;align-items:center;gap:12px;justify-content:center;color:#fff}
.login-brand b{font-family:var(--font-display);font-size:20px;display:block}
.login-brand span{font-size:13px;color:var(--side-muted)}
.login-card{background:var(--surface);border-radius:20px;padding:28px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.login-card h1{font-size:22px}
.login-card .lead{color:var(--muted);font-size:14px;margin-top:-8px}
.login-err{background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:10px}
.login-foot{text-align:center;color:var(--side-muted);font-size:12.5px}
.pw{position:relative}
.pw .input{padding-right:78px}
.pw button{position:absolute;right:6px;top:5px;height:32px;border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--accent);cursor:pointer;padding:0 10px;border-radius:8px}
.check{display:flex;gap:9px;align-items:center;font-size:13.5px;font-weight:600;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.btn.block{width:100%;height:46px;font-size:15px}
.me{margin-top:auto;padding:12px;border-radius:12px;background:var(--side-2);display:flex;flex-direction:column;gap:10px}
.me-top{display:flex;gap:10px;align-items:center;min-width:0}
.me-top b{color:#fff;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-top span{font-size:11.5px;color:#c9ced4;font-weight:700}
.me-top .avatar{color:#fff;font-size:12.5px;font-weight:800}
.me-acts{display:flex;gap:6px}
.me-acts button{flex:1;height:30px;border-radius:8px;border:1px solid #363b41;background:transparent;color:var(--side-ink);font-weight:700;font-size:12.5px;cursor:pointer}
.me-acts button:hover{background:#2c3137}
.me + .side-foot{margin-top:8px}
.role-sel{width:200px}
.lock-note{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.lock-note svg{width:15px;height:15px}

/* ---------- Relatórios ---------- */
.rel-filters{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center;padding:20px}
.rel-filters > *{justify-self:start;max-width:100%}
.rel-filters > label{font-size:13px;font-weight:800;color:var(--muted)}
.rel-acts{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 20px}
.rel-acts .btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.rel-help{padding:0 20px 18px;margin-top:-6px;font-size:12.5px;color:var(--muted)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.paper-band{background:var(--side);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px}
.paper-band b{font-family:var(--font-display);font-size:14px}
.paper-band span{color:var(--side-muted)}
.paper-b{padding:22px 24px 26px;display:flex;flex-direction:column;gap:16px}
.paper-b h2{font-size:21px}
.paper-b h3{font-size:15px;margin-top:6px}
.rel-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rel-res .mini b{font-size:19px;font-family:var(--font-display)}
table.t tfoot td{font-weight:800;background:var(--gold-soft);border-top:1px solid var(--line)}

/* ---------- Vendas ---------- */
.tipo-venda{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tipo-venda label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:8px 10px;border:1.5px solid var(--line-strong);border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--surface)}
.tipo-venda input{position:absolute;opacity:0;pointer-events:none}
.tipo-venda label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tipo-venda label:has(input:focus-visible){outline:2.5px solid var(--accent);outline-offset:2px}
.box-permuta{border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box-permuta h4{font-size:14px;color:var(--gold)}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.com-calc{font-size:12.5px;color:var(--muted)}
.com-calc b{color:var(--ink);font-size:15px}
.suffix{position:relative}
.suffix .input{padding-right:34px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:13px}
.vd-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* ---------- Diário de bordo ---------- */
.di-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.di-text{min-height:220px;font-size:15px;line-height:1.6}
.di-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.mic.rec{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.nota{display:flex;align-items:center;gap:16px}
.nota b{font-family:var(--font-display);font-size:46px;line-height:1}
.nota small{color:var(--muted);font-size:13px}
.di-sec h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.di-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.di-list.ok li::marker{color:var(--ok)}
.di-list.bad li::marker{color:var(--bad)}
.feedback{font-size:15px;line-height:1.65;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;white-space:pre-line}
.acao{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.acao.desfeito{opacity:.55;text-decoration:line-through}
.hist{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;width:100%;background:transparent;text-align:left;font:inherit;color:inherit}
.hist:hover{background:var(--surface-2);border-color:var(--line)}
.hist.sel{border-color:var(--accent);background:var(--accent-soft)}
.kw-row{display:grid;grid-template-columns:1fr 240px 36px;gap:8px;align-items:center}

@media (max-width: 1180px){
  .hero{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .25s;height:100%}
  body.nav-open .side{transform:none;box-shadow:var(--shadow-lg)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding:16px 16px 4px}
  .topbar h1{font-size:21px}
  #view{padding:14px 16px 40px}
  .split{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width: 620px){
  .goal{grid-template-columns:1fr;justify-items:center;text-align:center}
  .goal-stats{grid-template-columns:1fr 1fr 1fr;text-align:left}
  .kpis{grid-template-columns:1fr 1fr;gap:12px}
  .kpi .val{font-size:22px}
  .bar-row{grid-template-columns:1fr 70px;gap:8px}
  .bar-row .bar-track{grid-column:1 / -1;grid-row:2}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .rel-filters{grid-template-columns:1fr;gap:8px}
  .di-grid{grid-template-columns:1fr}
  .kw-row{grid-template-columns:1fr 150px 36px}
  .tipo-venda{grid-template-columns:1fr 1fr}
  .vd-sum{grid-template-columns:1fr 1fr;gap:12px}
  .span-2{grid-column:auto}
  .ev{grid-template-columns:52px 1fr}
  .ev .acts{grid-column:1 / -1;justify-content:flex-start}
  .tr-card{grid-template-columns:1fr}
  .tr-ic{display:none}
  .topbar .sync-chip{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</div>

  perfil: r.perfil, participa: r.participa, ativo: r.ativo, ...(r.permissoes && Object.keys(r.permissoes).length ? {permissoes: r.permissoes} : {}), senhaHash: '1'});
async function loadTable(c) {
  if (c === 'corretores') {
    const {data, error} = await sb.from('perfis').select('*'); if (error) throw error;
    S.corretores = new Map(data.map(r => [r.id, perfilParaUser(r)])); CORR_READY = true; return;
  }
  const {data, error} = await sb.from(c).select('id,data'); if (error) throw error;
  if (c === 'ponto') {
    const m = new Map();
    data.forEach(r => { const d = r.data || {}; if (!d.data || !d.corretorId) return;
      const doc = m.get(d.data) || {id: d.data, data: d.data, registros: {}};
      doc.registros[d.corretorId] = {hora: d.hora || '', roleta: d.roleta ?? '', status: d.status || ''}; m.set(d.data, doc); });
    S.ponto = m; return;
  }
  S[c] = new Map(data.map(r => [r.id, {...(r.data || {}), id: r.id}]));
}
let canal = null; const recarregar = {};
function scheduleReload(c) { clearTimeout(recarregar[c]); recarregar[c] = setTimeout(async () => { try { await loadTable(c); scheduleRender(true); } catch (e) {} }, 250); }
async function loadAll() {
  const timer = setTimeout(() => { if (MODE === 'loading') { setSync('stale'); scheduleRender(); } }, 12000);
  try { await Promise.all(COLS.map(loadTable)); clearTimeout(timer); setSync('online'); }
  catch (e) { clearTimeout(timer); setSync('stale'); toast('Não foi possível carregar os dados. Verifique a internet e recarregue a página.', 'bad'); }
  if (!canal) {
    canal = sb.channel('mudancas');
    ['perfis', ...TABELAS].forEach(t => canal.on('postgres_changes', {event: '*', schema: 'public', table: t}, () => scheduleReload(t === 'perfis' ? 'corretores' : t)));
    canal.subscribe();
  }
}
function clearData() { COLS.forEach(c => S[c] = new Map()); CORR_READY = false; if (canal) { sb.removeChannel(canal); canal = null; } }
const api = (acao, payload = {}) => fnCall('admin-usuarios', {acao, ...payload});
async function fnCall(nome, payload = {}) {
  const {data: {session}} = await sb.auth.getSession();
  let res;
  try {
    res = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/' + nome, {method: 'POST',
      headers: {'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + (session?.access_token || CFG.supabaseAnonKey)},
      body: JSON.stringify(payload)});
  } catch (e) { throw new Error('Não foi possível falar com o servidor. Verifique a internet.'); }
  let out = {}; try { out = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(out.erro || 'O servidor recusou a operação.');
  return out;
}
function writeErr(e) {
  const m = String(e?.message || '');
  if (/row-level security|permission denied|42501/i.test(m)) toast('Seu acesso não permite esta alteração.', 'bad');
  else toast('Não foi possível salvar agora. Tente novamente em instantes.', 'bad');
}
async function save(col, id, data) {
  const rec = {...data}; delete rec.id; rec.atualizadoEm = Date.now();
  if (col === 'corretores') {
    const prev = S.corretores.get(id), senha = rec._senha || undefined;
    delete rec._senha; delete rec.senhaHash; delete rec.atualizadoEm;
    try {
      const out = await api('salvar', {id: prev ? id : null, dados: rec, senha});
      const nid = out.id || id; S.corretores.set(nid, {...prev, ...rec, id: nid, senhaHash: '1'}); scheduleRender(true); scheduleReload('corretores'); return nid;
    } catch (e) { toast(e.message, 'bad'); scheduleReload('corretores'); return false; }
  }
  if (col === 'ponto') {
    const prevReg = S.ponto.get(id)?.registros || {}, reg = rec.registros || {};
    S.ponto.set(id, {id, data: id, registros: reg}); scheduleRender(true);
    const ups = [], dels = [];
    Object.entries(reg).forEach(([cid, r]) => { if (JSON.stringify(r) !== JSON.stringify(prevReg[cid])) ups.push({id: id + '_' + cid, data: {data: id, corretorId: cid, hora: r.hora || '', roleta: r.roleta ?? '', status: r.status || ''}}); });
    Object.keys(prevReg).forEach(cid => { if (!reg[cid]) dels.push(id + '_' + cid); });
    try {
      if (ups.length) { const {error} = await sb.from('ponto').upsert(ups); if (error) throw error; }
      if (dels.length) { const {error} = await sb.from('ponto').delete().in('id', dels); if (error) throw error; }
      return true;
    } catch (e) { writeErr(e); scheduleReload('ponto'); return false; }
  }
  S[col].set(id, {...rec, id}); scheduleRender(true);
  try { const {error} = await sb.from(col).upsert({id, data: rec}); if (error) throw error; return true; }
  catch (e) { writeErr(e); scheduleReload(col); return false; }
}
async function remove(col, id) {
  S[col].delete(id); scheduleRender(true);
  try { const {error} = await sb.from(col).delete().eq('id', id); if (error) throw error; return true; }
  catch (e) { writeErr(e); scheduleReload(col); return false; }
}

function gcalLink(e) {
  const toUTC = (d, h) => new Date(`${d}T${h || '09:00'}:00-03:00`).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const p = new URLSearchParams({action: 'TEMPLATE', text: e.titulo || 'Compromisso', dates: toUTC(e.data, e.inicio) + '/' + toUTC(e.data, e.fim || e.inicio), details: e.obs || '', location: e.local || '', ctz: TZ});
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function icsText(events) {
  const toUTC = (d, h) => new Date(`${d}T${h || '09:00'}:00-03:00`).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const e = s => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Patrimonio//Gestao Comercial//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    ...events.flatMap(v => ['BEGIN:VEVENT', 'UID:' + v.id + '@patrimonio-gestao', 'DTSTAMP:' + stamp, 'DTSTART:' + toUTC(v.data, v.inicio), 'DTEND:' + toUTC(v.data, v.fim || v.inicio),
      'SUMMARY:' + e(v.titulo), 'LOCATION:' + e(v.local), 'DESCRIPTION:' + e(v.obs),
      ...(v.lembrete ? ['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + e(v.titulo), 'TRIGGER:-PT' + v.lembrete + 'M', 'END:VALARM'] : []), 'END:VEVENT']),
    'END:VCALENDAR'].join('\r\n');
}

          : `<div class="banner">${ic('info')}<span>Seu acesso não permite enviar arquivos. Você ainda pode adicionar links abaixo.</span></div>`}

      }
      m.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; e.preventDefault(); const k = b.dataset.rm; (k[0] === 'f' ? files : queue).splice(+k.slice(1), 1); paint(); });

            const path = uid() + '/' + f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.\-]+/g, '_');

        if (e.key === 'Enter') { e.preventDefault(); const nx = horas.slice(i + 1).find(x => !x.disabled); nx ? nx.focus() : el.blur(); } };
      el.onchange = () => {
        const cid = el.closest('tr').dataset.cid, old = S.ponto.get(state.ponto.sel)?.registros?.[cid]?.hora || '';

        const t = d.slice(0, 2) + ':' + d.slice(2, 4); el.value = t;
        const v = from12(t, ap.dataset.v);
        if (v !== old) ptSet(cid, 'hora', v);
      };
    });
    $$('[data-vist]').forEach(el => el.onchange = () => {
      const v = S.visitas.get(el.dataset.vist); if (!v) return;

    });
  }
};
function ptSet(cid, field, value) {
  if (!canOp(cid)) return denied();
  const iso = state.ponto.sel, doc = S.ponto.get(iso) || {registros: {}};
  const reg = JSON.parse(JSON.stringify(doc.registros || {}));
  reg[cid] = {...(reg[cid] || {}), [field]: field === 'roleta' ? (value ? Number(value) : '') : value};
  if (field === 'hora' && value && !reg[cid].status) reg[cid].status = 'veio';
  save('ponto', iso, {data: iso, registros: reg});
}

const TIPOS_VENDA = ['Financiamento', 'Investimento próprio', 'Permuta', 'Permuta com torna'];
const isPermuta = t => t === 'Permuta' || t === 'Permuta com torna';
const parsePct = s => { const n = parseFloat(String(s ?? '').replace(/[^\d,.]/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const pctIn = v => v ? String(v).replace('.', ',') : '';
function comissoes(v) {
  const valor = +v.valor || 0, perm = isPermuta(v.tipoVenda) ? Math.min(+v.permutaValor || 0, valor) : 0;
  const cv = (valor - perm) * (+v.comVendaPct || 0) / 100 + perm * (+v.permutaComPct || 0) / 100;
  return {cv: r2(cv), ca: r2(valor * (+v.comAngPct || 0) / 100), perm, dinheiro: valor - perm};
}
const vendaDeVisita = v => ({data: v.data, cliente: v.cliente, imovel: v.imovel, vendedorId: v.corretorId, visitaId: v.id});
const vendasVisiveis = () => list('vendas').filter(v => can('operacaoTodos') || isMine(v.vendedorId) || isMine(v.angariadorId));

/* =========================================================
   Microfone (ditado por voz)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recAtivo = null;
const micBtn = target => SR ? `<button type="button" class="btn sm mic" data-act="mic" data-target="${target}">${ic('mic')}Falar</button>`
  : `<span class="small muted">${ic('mic').replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} Para ditar, use o microfone do teclado do celular.</span>`;
function ditar(el) {
  if (recAtivo) { recAtivo.stop(); return; }
  const ta = document.getElementById(el.dataset.target); if (!ta || !SR) return;
  const rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
  const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  let final = '';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) final += t.trim() + ' '; else interim += t; }
    ta.value = base + final + interim; ta.dispatchEvent(new Event('input', {bubbles: true}));
  };
  rec.onerror = e => toast(e.error === 'not-allowed' ? 'Permita o uso do microfone no navegador para ditar.' : e.error === 'no-speech' ? 'Não ouvi nada. Toque em Falar e tente de novo.' : 'O ditado foi interrompido. Toque em Falar para continuar.', 'warn');
  rec.onend = () => { recAtivo = null; $$('[data-act="mic"]').forEach(b => { b.classList.remove('rec'); b.innerHTML = ic('mic') + 'Falar'; }); };
  try { rec.start(); recAtivo = rec; el.classList.add('rec'); el.innerHTML = ic('mic') + 'Parar'; toast('Pode falar. Toque em Parar quando terminar.'); }
  catch (e) { toast('Não foi possível ligar o microfone.', 'bad'); }
}

const DIARIO_PADRAO = {

  virtudes: ['Disciplina', 'Persistência', 'Empatia', 'Organização'],

const cfgDiario = () => { const c = S.config.get('diario') || {}; return {...DIARIO_PADRAO, ...Object.fromEntries(Object.entries(c).filter(([k]) => k in DIARIO_PADRAO))}; };
const notaCor = n => n == null ? 'var(--muted)' : n >= 8 ? 'var(--ok)' : n >= 6 ? 'var(--warn)' : 'var(--bad)';
const diarioId = (data, cid) => data + '_' + cid;

function analiseHTML(e, podeDesfazer) {
  if (!e) return `<div class="card empty"><b>Nenhum registro neste dia</b>Descreva o seu dia e toque em “Analisar meu dia”.</div>`;
  const a = e.analise;
  if (!a) return `<div class="card empty"><b>Texto salvo, ainda sem análise</b>Toque em “Analisar meu dia” para receber o feedback.</div>`;
  const li = (arr, cls) => (arr || []).length ? `<ul class="di-list ${cls || ''}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="small muted">—</div>';
  return `<div class="card"><div class="card-b stack" style="gap:18px">
    <div class="row" style="justify-content:space-between">
      <div class="nota"><b class="num" style="color:${notaCor(a.nota)}">${a.nota ?? '—'}</b><div><div style="font-weight:800">Nota do dia</div><small>de 0 a 10 · ${esc(fmtD(e.data))}</small></div></div>
      <span class="pill neutral">${ic('spark').replace('<svg', '<svg style="width:13px;height:13px"')}Análise por IA</span>
    </div>
    <div class="di-sec"><h4>Feedback</h4><div class="feedback">${esc(a.feedback || '')}</div></div>
    <div class="grid-2" style="align-items:start">
      <div class="di-sec"><h4 style="color:var(--ok)">Pontos fortes</h4>${li(a.pontos_fortes, 'ok')}</div>
      <div class="di-sec"><h4 style="color:var(--bad)">Pontos a melhorar</h4>${li(a.pontos_fracos, 'bad')}</div>
    </div>
    <div class="di-sec"><h4>Mudanças para chegar à excelência e vender mais</h4>${(a.melhorias || []).length ? `<ol class="di-list">${a.melhorias.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '—'}</div>
    ${(a.mantra || []).length ? `<div class="di-sec"><h4>Alinhamento com o mantra da equipe</h4><div class="stack" style="gap:6px">${a.mantra.map(m => `<div class="small"><b>${esc(m.item)}</b> · <span class="muted">${esc(m.avaliacao)}</span></div>`).join('')}</div></div>` : ''}
    ${(e.acoes || []).length ? `<div class="di-sec"><h4>Lançado automaticamente</h4><div class="stack" style="gap:8px">${e.acoes.map((x, i) => `<div class="acao ${x.desfeito ? 'desfeito' : ''}">
        <span class="pill ${x.ok ? 'ok' : 'bad'}">${x.tipo === 'venda' ? 'Venda' : x.tipo === 'visita' ? 'Visita' : 'Agenda'}</span><span class="grow">${esc(x.resumo)}${x.ok ? '' : ' · não foi possível lançar'}</span>
        ${x.ok && !x.desfeito && podeDesfazer ? `<button class="btn sm" data-act="di-desfazer" data-id="${esc(e.id)}" data-i="${i}">Desfazer</button>` : ''}${x.desfeito ? '<span class="small muted">desfeito</span>' : ''}</div>`).join('')}</div>
      <div class="small muted" style="margin-top:6px">Vendas lançadas assim ficam marcadas como “Revisar dados” em Vendas, para completar tipo de venda e comissões.</div></div>` : ''}
  </div></div>`;
}

async function analisarDia(btn) {
  const texto = $('#di-texto').value.trim();
  if (texto.length < 30) { $('#di-texto').focus(); return toast('Descreva o seu dia com um pouco mais de detalhe para a análise ser útil.', 'warn'); }
  if (recAtivo) recAtivo.stop();
  const data = state.diario.data, id = diarioId(data, ME.id), prev = S.diario.get(id);
  const restaura = () => { btn.disabled = false; btn.innerHTML = ic('spark') + 'Analisar meu dia'; };
  btn.disabled = true; btn.innerHTML = 'Analisando…';
  const base = {corretorId: ME.id, data, texto, criadoEm: prev?.criadoEm || Date.now(), analise: prev?.analise || null, acoes: prev?.acoes || []};
  if (!await save('diario', id, base)) return restaura();
  let out;
  try { out = await fnCall('diario-ia', {texto, data}); }
  catch (e) { restaura(); state.dirty = false; render(); return toast(e.message, 'bad'); }
  const jaLancou = (prev?.acoes || []).length > 0;
  const acoes = jaLancou ? prev.acoes : await criarRegistros(out.registros || [], id, data);
  await save('diario', id, {...base, analise: {...(out.analise || {}), em: Date.now()}, acoes});
  restaura(); state.dirty = false; render();
  toast(jaLancou ? 'Análise atualizada. Os lançamentos da primeira análise foram mantidos.' : acoes.length ? `Análise pronta e ${acoes.filter(a => a.ok).length} registro(s) lançado(s).` : 'Análise pronta.');
}
async function criarRegistros(regs, did, dataDia) {
  const out = [];
  for (const r of regs.slice(0, 10)) {
    const data = /^\d{4}-\d{2}-\d{2}$/.test(r.data || '') ? r.data : dataDia;
    const hora = /^\d{2}:\d{2}$/.test(r.hora || '') ? r.hora : '';
    if (r.tipo === 'venda' && +r.valor > 0) {
      const id = uid();
      const ok = await save('vendas', id, {referencia: (r.imovel || 'A definir').slice(0, 60), data, cliente: r.cliente || '', imovel: r.imovel || '', valor: r2(+r.valor), tipoVenda: '',
        permutaDesc: '', permutaValor: 0, permutaComPct: 0, tornaValor: 0, entrada: 0, sinal: 0, vendedorId: ME.id, angariadorId: '',
        comVendaPct: 0, comAngPct: 0, comVendaValor: 0, comAngValor: 0, obs: r.descricao || '', visitaId: '', criadoPor: ME.id, pendente: true, origem: 'diario', diarioId: did});
      out.push({tipo: 'venda', col: 'vendas', id, ok: !!ok, resumo: `Venda de ${brlC(r.valor)}${r.cliente ? ' para ' + r.cliente : ''}${r.imovel ? ' · ' + r.imovel : ''}`});
    } else if (r.tipo === 'visita') {
      const id = uid();

async function hashSenha(login, senha) {
  if (!senha) return '';
  if (!(window.crypto && crypto.subtle)) return '';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('patrimonio:' + login + ':' + senha));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

const RELTIPOS = {ponto: 'Cartão ponto', metas: 'Metas', agenda: 'Agenda', vendas: 'Vendas', angariacao: 'Angariação'};

const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

const toMin = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + b; };

const PDF_LIBS = [
  ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'],
  ['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js']];
const addScript = src => new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => { sc.remove(); fail(new Error('pdf-lib')); }; document.head.appendChild(sc); });
let pdfLibP = null;
function loadPdfLib() {
  if (window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  if (!pdfLibP) pdfLibP = PDF_LIBS.reduce((p, [a, b]) => p.then(() => addScript(a).catch(() => addScript(b))), Promise.resolve())
    .then(() => { if (!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable)) throw new Error('pdf-lib'); })
    .catch(e => { pdfLibP = null; throw e; });
  return pdfLibP;
}
function buildPdf(m) {
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'pt', format: 'a4', orientation: m.wide ? 'landscape' : 'portrait'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), L = 40;
  doc.setFillColor(20, 22, 25); doc.rect(0, 0, W, 58, 'F');
  doc.setFillColor(181, 18, 27); doc.rect(0, 58, W, 3, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.text('Imobiliária 2.0 · Gestão comercial', L + 46, 27);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(170, 186, 194); doc.text('Gerado em ' + m.gerado, L + 46, 43);
  doc.setFillColor(240, 242, 244); doc.circle(L + 18, 29, 19, 'F');
  try { doc.addImage(LOGO, 'PNG', L + 4, 15, 28, 28); } catch (e) {}
  doc.setTextColor(20, 32, 42); doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.text(m.titulo, L, 98);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(90, 103, 113); doc.text(m.subtitulo, L, 116);
  let y = 134; const n = m.resumo.length, gap = 10, bw = (W - 2 * L - gap * (n - 1)) / n;
  m.resumo.forEach(([l, v], i) => { const x = L + i * (bw + gap);
    doc.setFillColor(246, 247, 245); doc.setDrawColor(224, 228, 222); doc.roundedRect(x, y, bw, 50, 6, 6, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(110, 120, 128); doc.text(String(l).toUpperCase(), x + 10, y + 17, {maxWidth: bw - 16});
    doc.setFontSize(14); doc.setTextColor(20, 32, 42); doc.text(String(v), x + 10, y + 38); });
  y += 76;
  m.secoes.forEach(sec => {
    if (y > H - 110) { doc.addPage(); y = 50; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(20, 32, 42); doc.text(sec.titulo, L, y);
    const cs = {}; (sec.right || []).forEach(i => cs[i] = {halign: 'right'});
    doc.autoTable({startY: y + 8, margin: {left: L, right: L, top: 40, bottom: 44},
      head: [sec.head], body: sec.body.length ? sec.body.map(r => r.map(String)) : [[{content: 'Nenhum registro no período.', colSpan: sec.head.length, styles: {halign: 'center', textColor: [120, 130, 138], fontStyle: 'italic'}}]],
      foot: sec.foot ? [sec.foot.map(String)] : undefined, showFoot: 'lastPage',
      styles: {font: 'helvetica', fontSize: 9, cellPadding: 6, textColor: [20, 32, 42], lineColor: [224, 228, 222], lineWidth: .5},
      headStyles: {fillColor: [181, 18, 27], textColor: 255, fontStyle: 'bold'},
      footStyles: {fillColor: [236, 239, 242], textColor: [22, 24, 27], fontStyle: 'bold'},
      alternateRowStyles: {fillColor: [247, 248, 249]}, columnStyles: cs,
      didParseCell: d => { if (d.section !== 'body') return; const t = d.cell.raw;
        if (t === 'Veio' || t === 'Negócio fechado' || t === 'Realizada') d.cell.styles.textColor = [27, 135, 73];
        else if (t === 'Não veio' || t === 'Cliente não veio') d.cell.styles.textColor = [194, 65, 12];
        else if (t === 'Proposta enviada') d.cell.styles.textColor = [176, 111, 6]; }});
    y = doc.lastAutoTable.finalY + 30;
  });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140, 150, 156);
    doc.text(m.titulo + ' · ' + m.subtitulo, L, H - 22, {maxWidth: W - 160}); doc.text(`Página ${i} de ${pages}`, W - L, H - 22, {align: 'right'}); }
  return doc;
}
const slugify = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const pdfPronto = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable);
async function relExport(kind, btn) {
  if (!pdfPronto()) {
    if (btn) btn.disabled = true;
    try { await loadPdfLib(); toast('Gerador de PDF pronto. Toque no botão de novo.'); }
    catch (e) { toast('Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.', 'bad'); }
    finally { if (btn) btn.disabled = false; }
    return;
  }
  const janela = kind === 'print' ? window.open('', '_blank') : null;
  const m = relModel(), doc = buildPdf(m);
  const name = `relatorio-${slugify(RELTIPOS[m.tipo])}-${slugify(m.quem)}-${m.a}${m.a !== m.b ? '_a_' + m.b : ''}.pdf`;
  const blob = doc.output('blob');
  if (kind === 'airdrop') {
    const file = new File([blob], name, {type: 'application/pdf'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: m.titulo}); } catch (e) { if (e.name !== 'AbortError') toast('Não foi possível abrir o compartilhamento.', 'bad'); }
      return;
    }
    toast('Este aparelho não abre a tela de compartilhamento. O PDF foi baixado; envie pelo AirDrop a partir dele.', 'warn');
  }
  const url = URL.createObjectURL(blob);
  if (kind === 'print') {
    if (janela) { janela.location.href = url; toast('Use Imprimir na janela do PDF que abriu.'); }
    else { toast('Libere as janelas pop-up para imprimir. O PDF foi baixado.', 'warn'); }
    if (janela) { setTimeout(() => URL.revokeObjectURL(url), 60000); return; }
  }
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  if (kind === 'pdf') toast('PDF salvo.');
}
function waText(m) {
  let t = `*${m.titulo}*\n${m.subtitulo}\n\n` + m.resumo.map(([l, v]) => `• ${l}: ${v}`).join('\n');
  const s = m.secoes[0];
  if (s && s.body.length) { t += `\n\n*${s.titulo}*\n` + s.body.slice(0, 25).map(r => r.join(' | ')).join('\n'); if (s.body.length > 25) t += `\n… e mais ${s.body.length - 25} linha(s) no PDF.`; }
  if (s && s.foot) t += '\n' + s.foot.filter(x => x !== '').join(' | ');
  return t + '\n\n_Imobiliária 2.0 · Gestão comercial_';
}

  'us-edit': el => { const c = corretor(el.dataset.id); if (c && !isMaster() && perfilOf(c) === 'master') return denied(); state.users.tab = 'form'; state.users.editId = el.dataset.id; render(); window.scrollTo(0, 0); },
  'us-filtro': el => { state.users.filtro = el.dataset.v; render(); },
  'us-limpar': () => confirmBox('Remover todos os registros de exemplo (corretores, metas, visitas, agenda, cards, treinamentos e cartão ponto de exemplo)? Os dados que você cadastrou ficam.', 'Remover exemplos', async () => {
    let n = 0; for (const c of COLS) for (const r of list(c).filter(r => r.exemplo)) { if (await remove(c, r.id)) n++; }
    toast(n + ' registro(s) de exemplo removidos.');
  })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (ACT_PERM[el.dataset.act] && !can(ACT_PERM[el.dataset.act])) return denied();
  if (el.tagName === 'BUTTON' || el.dataset.act === 'modal-bg') { fn(el, e); }
});
document.addEventListener('input', e => { if (e.target.closest('[data-guard]')) state.dirty = true; });

/* ---------- Início ---------- */
(function boot() {
  const h = location.hash.slice(1); if (VIEWS[h]) state.view = h;
  render();
  initAuth();
})();
</script>
</body>
</html>
