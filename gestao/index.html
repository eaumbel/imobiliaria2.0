        ${testes.length < 2 ? linha('Reserva', '<span class="pill neutral">nenhuma</span> <span class="small muted">cadastre a chave de outra IA para a análise seguir nela quando a principal não responder</span>') : ''}

async function hashSenha(login, senha) {
  if (!senha) return '';
  if (!(window.crypto && crypto.subtle)) return '';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('patrimonio:' + login + ':' + senha));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');

async function salvarMeusDados() {
  if (!ME || ME.virtual) return;
  const obrig = ['md-nome', 'md-tel', 'md-email', ...(perfilOf(ME) === 'master' ? [] : ['md-creci'])];
  if (!requireFields(obrig)) return;
  const dados = {p_nome: val('md-nome'), p_telefone: val('md-tel'), p_email: val('md-email').toLowerCase(), p_creci: val('md-creci'), p_especialidade: val('md-esp')};

  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(dados.p_email)) { $('#md-email').classList.add('err'); return toast('Confira o e-mail informado.', 'warn'); }
  const btn = $('#md-save'); btn.disabled = true;
  try {
    const {data, error} = await sb.rpc('salvar_meus_dados', dados);
    if (error) {
      if (/salvar_meus_dados|PGRST202|does not exist|schema cache/i.test(error.message + ' ' + (error.code || ''))) return toast('O servidor ainda não foi atualizado para “Meus dados”. Avise o administrador do sistema.', 'bad');
      if (error.code === '22023' || error.code === '42501') return toast(error.message, 'warn');
      return writeErr(error);
    }
    const r = Array.isArray(data) ? data[0] : data;
    if (r) { const atual = perfilParaUser(r); S.corretores.set(atual.id, atual); ME = atual; }
    state.dirty = false; toast('Seus dados foram atualizados.'); scheduleReload('corretores'); render();
  } finally { const b = $('#md-save'); if (b) b.disabled = false; }
}

// Fontes e utilitários de texto para o pdf-lib (Helvetica só aceita caracteres WinAnsi)
async function ferramentasPdf(pdf) {
  const {StandardFonts, rgb} = window.PDFLib;
  const font = await pdf.embedFont(StandardFonts.Helvetica), bold = await pdf.embedFont(StandardFonts.HelveticaBold);
  const cs = new Set(font.getCharacterSet());
  const limpa = s => [...String(s ?? '').replace(/[\r\n\t]+/g, ' ').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")].filter(ch => cs.has(ch.codePointAt(0))).join('').replace(/\s+/g, ' ').trim();
  const tinta = rgb(43 / 255, 43 / 255, 43 / 255), ouro = rgb(188 / 255, 144 / 255, 97 / 255), filete = rgb(217 / 255, 203 / 255, 184 / 255);
  const quebra = (txt, f, sz, larg, recuo = 0) => {
    const out = []; let ln = '';
    for (const w of limpa(txt).split(' ')) { const t = ln ? ln + ' ' + w : w; if (f.widthOfTextAtSize(t, sz) > larg - (out.length ? 0 : recuo) && ln) { out.push(ln); ln = w; } else ln = t; }
    if (ln) out.push(ln); return out;
  };
  // Título de seção no estilo do modelo (cor ouro + filete); devolve o y abaixo
  const titulo = (pg, txt, x, y, larg, sz = 10) => {
    pg.drawText(limpa(txt), {x, y, size: sz, font: bold, color: ouro});
    pg.drawLine({start: {x, y: y - 4}, end: {x: x + larg, y: y - 4}, thickness: 0.8, color: filete});
    return y - 16;
  };
  // Parágrafo justificado; devolve o y abaixo
  const paragrafo = (pg, txt, x, y, larg, sz = 8.5, lh = 11.5) => {
    const ls = quebra(txt, font, sz, larg);
    ls.forEach((l, i) => {
      const pal = l.split(' '), ultima = i === ls.length - 1;
      if (ultima || pal.length < 2) { pg.drawText(l, {x, y: y - sz, size: sz, font, color: tinta}); }
      else {
        const livre = larg - pal.reduce((a, w) => a + font.widthOfTextAtSize(w, sz), 0), esp = livre / (pal.length - 1); let xx = x;
        pal.forEach(w => { pg.drawText(w, {x: xx, y: y - sz, size: sz, font, color: tinta}); xx += font.widthOfTextAtSize(w, sz) + esp; });
      }
      y -= lh;
    });
    return y;
  };
  // Lista "Rótulo: valor" com quebra de linha; devolve o y abaixo
  const linhas = (pg, itens, x, y, larg, sz = 8) => {
    for (const [rot, val] of itens) {
      const r0 = limpa(rot) + ': ', wr = bold.widthOfTextAtSize(r0, sz);
      pg.drawText(r0, {x, y: y - sz, size: sz, font: bold, color: tinta});
      quebra(val || '—', font, sz, larg, wr).forEach((l, i) => { pg.drawText(l, {x: x + (i ? 0 : wr), y: y - sz, size: sz, font, color: tinta}); y -= sz + 3.5; });
      y -= 1.5;
    }
    return y;
  };
  return {font, bold, limpa, tinta, ouro, filete, quebra, titulo, paragrafo, linhas};
}

// Contrato: modelo preenchido + assinatura + corretor + ano do servidor + cláusula + registro
async function montarContratoPdf(md, valores, assinaturaPng, reg, cor, hashDossie) {
  const {PDFDocument, rgb, PDFTextField, PDFCheckBox} = window.PDFLib;
  const pdf = await PDFDocument.load(await modeloBytes(md));
  const T = await ferramentasPdf(pdf), {font, bold, limpa, tinta} = T;
  const c = carimbo(reg);
  const textos = {...valores, data_dia: c.D, data_mes: MESES[c.M - 1]};
  const form = pdf.getForm();
  for (const f of form.getFields()) {
    const n = f.getName();
    if (f instanceof PDFTextField) {
      const max = f.getMaxLength(); let t = limpa(textos[n]); if (max) t = t.slice(0, max);
      f.setText(t);
      // Reduz a fonte quando o texto não cabe no campo (padrão do modelo: 9 pt)
      const ws = f.acroField.getWidgets(), w = ws[0].getRectangle().width;
      const sz = t ? Math.max(5, Math.min(9, (w - 6) / font.widthOfTextAtSize(t, 1))) : 9, da = `/Helv ${sz.toFixed(2)} Tf 0 0 0 rg`;
      f.acroField.setDefaultAppearance(da); ws.forEach(x => x.setDefaultAppearance(da));
    } else if (f instanceof PDFCheckBox) { valores[n] ? f.check() : f.uncheck(); }
  }
  form.updateFieldAppearances(font);
  form.flatten();

  const p = md.pos, pg = pdf.getPages()[p.pagina], H = pg.getHeight(), W = pg.getWidth(), L = 36, larg = W - 72;
  // Ano gravado no servidor no lugar do ano impresso no modelo
  const tam = p.ano.refLarg / font.widthOfTextAtSize(p.ano.ref, 1);
  pg.drawRectangle({x: p.ano.x - 1, y: H - p.ano.yMax - 0.5, width: font.widthOfTextAtSize('2026.', tam) + 3, height: p.ano.yMax - p.ano.yMin + 1, color: rgb(1, 1, 1)});
  pg.drawText(c.Y + '.', {x: p.ano.x, y: H - (p.ano.yMax - 0.212 * tam), size: tam, font, color: tinta});
  // Exclusividade: opções Sim/Não no lugar do "NÃO" impresso no modelo
  if (md.exclusividade) {
    const e = md.exclusividade, pg1 = pdf.getPages()[0], H1 = pg1.getHeight(), sz = 9.5;
    const base = H1 - (e.yMax - 0.212 * sz), cy = base + sz * 0.33, r = 3.6;
    pg1.drawRectangle({x: e.x - 1, y: H1 - e.yMax - 0.5, width: e.larg + 3, height: e.yMax - e.yMin + 1, color: rgb(1, 1, 1)});
    let x = e.x + 1;
    const dias = String(valores.exclusividade_dias || '').replace(/\D/g, '');
    const opcoes = valores.exclusividade_sim
      ? [['exclusividade_sim', 'SIM' + (dias ? ` · ${+dias} ${+dias === 1 ? 'DIA' : 'DIAS'}` : '')]]
      : [['exclusividade_sim', 'SIM'], ['exclusividade_nao', 'NÃO']];
    for (const [k, rot] of opcoes) {
      pg1.drawCircle({x: x + r, y: cy, size: r, borderColor: tinta, borderWidth: 0.9});
      if (valores[k]) pg1.drawCircle({x: x + r, y: cy, size: r - 1.6, color: tinta});
      pg1.drawText(rot, {x: x + 2 * r + 3, y: base, size: sz, font: bold, color: tinta});
      x += 2 * r + 3 + bold.widthOfTextAtSize(rot, sz) + 10;
    }
  }
  // Assinatura do(a) proprietário(a), acima da linha
  if (assinaturaPng) {
    const img = await pdf.embedPng(assinaturaPng), a = p.assinatura;
    const bw = a.x1 - a.x0, bh = a.base - a.topo, k = Math.min(bw / img.width, bh / img.height), w = img.width * k, h = img.height * k;
    pg.drawImage(img, {x: a.x0 + (bw - w) / 2, y: H - a.base, width: w, height: h});
  }
  // Corretor(a) responsável, acima da linha
  const nome = limpa(cor?.nome), creci = limpa(cor?.creci);
  if (nome) {
    const r = p.corretor, sz = Math.min(10, r.larg / bold.widthOfTextAtSize(nome, 1));
    pg.drawText(nome, {x: r.cx - bold.widthOfTextAtSize(nome, sz) / 2, y: H - r.linha + (creci ? 13 : 6), size: sz, font: bold, color: tinta});
    if (creci) { const t = 'CRECI ' + creci, s2 = 7.5; pg.drawText(t, {x: r.cx - font.widthOfTextAtSize(t, s2) / 2, y: H - r.linha + 4, size: s2, font, color: tinta}); }
  }
  // Cláusula de assinatura eletrônica
  let y = H - p.carimbo;
  y = T.titulo(pg, 'Cláusula de assinatura eletrônica', L, y, larg);
  y = T.paragrafo(pg, CLAUSULA_ASSINATURA, L, y, larg);
  // Registro da assinatura eletrônica
  const g = reg.geo || {}, id = reg.identidade || {};
  y = T.titulo(pg, 'Registro da assinatura eletrônica', L, y - 14, larg);
  y = T.linhas(pg, [
    ['Data e hora', `${c.txt} (horário de Brasília, registrado pelo servidor)`],
    ['IP do dispositivo', reg.ip || 'não identificado'],
    ['Local', g.endereco || (g.lat != null ? 'endereço não identificado' : 'não registrado')],
    ['Coordenadas', geoTxt(g)],
    ['Identificação', `documento oficial com foto (${id.semVerso ? 'frente' : 'frente e verso'}) e selfie segurando o documento, mantidos no dossiê de comprovação`],
    ['Autorização', `o(a) proprietário(a) marcou "${ACEITE_TXT}" antes de assinar`],
    ['Corretor(a) responsável', nome || '—'],
    ['Código do documento', reg.id],
    ['Dossiê de comprovação (SHA-256)', hashDossie || '—']
  ], L, y, larg);
  pdf.setTitle(limpa(`${md.titulo}${reg.cliente ? ' · ' + reg.cliente : ''}`));
  pdf.setAuthor(limpa(cor?.nome || '')); pdf.setCreator('Imobiliária 2.0 · Gestão comercial'); pdf.setProducer('Imobiliária 2.0 · Gestão comercial');
  return pdf.save();
}

// Dossiê de comprovação: documento com foto, selfie com documento, assinatura e registro (uso interno)
async function montarDossiePdf(md, reg, ident, assinaturaPng, cor, opts = {}) {
  const papel = opts.papel || 'Proprietário(a)', aceite = opts.aceite || ACEITE_TXT, linhaAss = opts.linha || 'PROPRIETÁRIO(A)';

  const W = 595.28, H = 841.89, L = 40, larg = W - 80, c = carimbo(reg), g = reg.geo || {};
  const nova = () => {
    const pg = pdf.addPage([W, H]);
    const rod = limpa(`Dossiê de comprovação de identidade · Código ${reg.id} · Documento interno e confidencial, contém dados pessoais (LGPD)`);
    pg.drawText(rod, {x: (W - font.widthOfTextAtSize(rod, 7)) / 2, y: 24, size: 7, font, color: rgb(.45, .45, .45)});
    return pg;
  };
  const imagem = async (pg, dataUrl, x, yTopo, maxW, maxH, rot, borda = true) => {
    const im = /^data:image\/png/.test(dataUrl) ? await pdf.embedPng(dataUrl) : await pdf.embedJpg(dataUrl);
    const k = Math.min(maxW / im.width, maxH / im.height), w = im.width * k, h = im.height * k, xx = x + (maxW - w) / 2;
    pg.drawText(limpa(rot), {x, y: yTopo - 9, size: 8.5, font: bold, color: tinta});
    pg.drawImage(im, {x: xx, y: yTopo - 16 - h, width: w, height: h});
    if (borda) pg.drawRectangle({x: xx, y: yTopo - 16 - h, width: w, height: h, borderColor: rgb(.8, .8, .8), borderWidth: 0.6});
    return yTopo - 16 - h;
  };
  let pg = nova(), y = H - 50;
  pg.drawText(limpa('Dossiê de comprovação de identidade'), {x: L, y, size: 16, font: bold, color: T.ouro});
  y -= 16; pg.drawText(limpa(`${md.titulo} · ${papel} · Código ${reg.id}`), {x: L, y, size: 9, font, color: tinta}); y -= 22;
  y = T.titulo(pg, 'Registro', L, y, larg);
  y = T.linhas(pg, [
    [papel, reg.cliente || '—'], ['CPF/CNPJ', reg.cpf || '—'], ['Imóvel', reg.imovel || '—'],
    ['Data e hora', `${c.txt} (horário de Brasília, registrado pelo servidor)`],
    ['IP do dispositivo', reg.ip || 'não identificado'],
    ['Local', g.endereco || 'endereço não identificado'], ['Coordenadas', geoTxt(g)],
    ['Autorização', `marcou "${aceite}"`],
    ['Corretor(a) responsável', limpa(cor?.nome) || '—'],
    ['Aparelho', navigator.userAgent]
  ], L, y, larg, 8.5);
  y = T.titulo(pg, 'Documento oficial com foto', L, y - 10, larg);
  const meia = (larg - 16) / 2, altImg = Math.min(250, y - 60);
  await imagem(pg, ident.frente, L, y, meia, altImg, 'Frente');
  if (ident.verso) await imagem(pg, ident.verso, L + meia + 16, y, meia, altImg, 'Verso');
  else pg.drawText(limpa('Verso: documento sem verso'), {x: L + meia + 16, y: y - 9, size: 8.5, font: bold, color: tinta});
  pg = nova(); y = H - 50;
  y = T.titulo(pg, 'Selfie segurando o documento', L, y, larg);
  y = await imagem(pg, ident.selfie, L, y, larg, 470, 'Foto tirada pela câmera do aparelho no momento da assinatura');
  y = T.titulo(pg, 'Assinatura', L, y - 22, larg);
  y = await imagem(pg, assinaturaPng, L + larg / 4, y, larg / 2, 90, '', false);
  pg.drawLine({start: {x: L + larg / 4, y: y - 4}, end: {x: L + larg * 3 / 4, y: y - 4}, thickness: 0.8, color: tinta});
  const lb = limpa(linhaAss); pg.drawText(lb, {x: (W - bold.widthOfTextAtSize(lb, 8.5)) / 2, y: y - 16, size: 8.5, font: bold, color: tinta});
  pdf.setTitle(limpa(`Dossiê de comprovação · ${reg.cliente || reg.id}`)); pdf.setCreator('Imobiliária 2.0 · Gestão comercial'); pdf.setProducer('Imobiliária 2.0 · Gestão comercial');
  return pdf.save();
}

/* ---------- Páginas do PDF como imagem (visualizar e imprimir em qualquer aparelho) ---------- */
async function paginasPdf(blob, escala) {
  await comCarregando(loadPdfJs);
  const doc = await pdfjs().getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise, out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const pg = await doc.getPage(i), vp = pg.getViewport({scale: escala}), cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await pg.render({canvasContext: ctx, viewport: vp}).promise;
    out.push(cv.toDataURL('image/jpeg', 0.92));
  }
  doc.destroy();
  return out;
}
const imgsImpressao = d => d.imgs || (d.imgs = paginasPdf(d.blob, 2.5).catch(e => { d.imgs = null; throw e; }));

/* ---------- Ações sobre o documento assinado ---------- */
function baixarDoc(d) {
  const url = URL.createObjectURL(d.blob), a = document.createElement('a');
  a.href = url; a.download = d.nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
// Impressão sem usar a página do sistema (que é pesada para a prévia de impressão do navegador):
// - Chrome, Edge e Firefox no computador: imprime o próprio PDF, pelo leitor de PDF do navegador.
// - Safari e celulares: imprime uma página separada só com as páginas do contrato (imagens).
// - iPhone/iPad: imprime pela própria página, que é o que o Safari do iOS aceita.
const SAFARI = /^((?!chrome|chromium|crios|fxios|edg|opr|android).)*safari/i.test(navigator.userAgent);
const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let IMP_FRAME = null, IMP_URL = null;
function quadroImpressao() {
  if (IMP_FRAME) IMP_FRAME.parentNode?.removeChild(IMP_FRAME);
  if (IMP_URL) { URL.revokeObjectURL(IMP_URL); IMP_URL = null; }
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1; f.title = 'Impressão';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  IMP_FRAME = f; return f;
}
function imprimirPdfNativo(d) {
  return new Promise((ok, falha) => {
    const f = quadroImpressao(); IMP_URL = URL.createObjectURL(d.blob);
    const prazo = setTimeout(() => falha(new Error('tempo')), 15000);
    f.onload = () => setTimeout(() => {
      clearTimeout(prazo);
      try { f.contentWindow.focus(); f.contentWindow.print(); ok(); } catch (e) { falha(e); }
    }, 400);
    f.src = IMP_URL; document.body.appendChild(f);
  });
}
async function imprimirImagens(d) {
  const imgs = await imgsImpressao(d);
  const f = quadroImpressao();
  f.srcdoc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(d.nome)}</title><style>
    @page{size:A4;margin:0} html,body{margin:0;padding:0;background:#fff}
    img{display:block;width:210mm;height:296.5mm;object-fit:contain;break-after:page;page-break-after:always}
    img:last-child{break-after:auto;page-break-after:auto}</style></head><body>${imgs.map(s => `<img src="${s}" alt="">`).join('')}</body></html>`;
  await new Promise((ok, falha) => {
    const prazo = setTimeout(() => falha(new Error('tempo')), 15000);
    f.onload = async () => {
      clearTimeout(prazo);
      try {
        const w = f.contentWindow;
        await Promise.all([...w.document.images].map(i => i.decode ? i.decode().catch(() => {}) : null));
        w.focus(); w.print(); ok();
      } catch (e) { falha(e); }
    };
    document.body.appendChild(f);
  });
}
async function imprimirNaPagina(d) {
  const imgs = await imgsImpressao(d), root = $('#print-root');
  root.innerHTML = imgs.map(s => `<div class="pg"><img src="${s}" alt=""></div>`).join('');
  await Promise.all($$('img', root).map(i => i.decode ? i.decode().catch(() => {}) : null));
  let st = document.getElementById('print-page');
  if (!st) { st = document.createElement('style'); st.id = 'print-page'; st.textContent = '@page{size:A4;margin:0}'; document.head.appendChild(st); }
  document.body.classList.add('imprimindo');
  const fim = () => { document.body.classList.remove('imprimindo'); root.innerHTML = ''; st.parentNode?.removeChild(st); window.removeEventListener('afterprint', fim); };
  window.addEventListener('afterprint', fim);
  window.print();
}
let IMPRIMINDO = false;
async function imprimirDoc(d, btn) {
  if (IMPRIMINDO) return;
  IMPRIMINDO = true; if (btn) btn.disabled = true;
  try {
    if (IOS) await imprimirNaPagina(d);
    else if (!MOVEL && !SAFARI) { try { await imprimirPdfNativo(d); } catch (e) { await imprimirImagens(d); } }
    else await imprimirImagens(d);
  } catch (e) { toast('Não foi possível abrir a impressão. Use Exportar e imprima o PDF baixado.', 'bad'); }
  finally { IMPRIMINDO = false; if (btn) setTimeout(() => { btn.disabled = false; }, 800); }
}
const arquivoDe = d => new File([d.blob], d.nome, {type: 'application/pdf'});
const podeCompartilhar = d => { try { return !!(navigator.canShare && navigator.canShare({files: [arquivoDe(d)]})); } catch (e) { return false; } };
function compartilharDoc(d) {

function textoDoc(d) {

function abrirLink(href, alvo) { const a = document.createElement('a'); a.href = href; if (alvo) { a.target = alvo; a.rel = 'noopener'; } document.body.appendChild(a); a.click(); a.remove(); }

function emailDoc(d) {

  const assunto = `${d.reg.modeloNome || 'Contrato'}${d.reg.cliente ? ' · ' + d.reg.cliente : ''}`;

async function prepararLink(d) {

const DOCS_CACHE = new Map();
async function obterDoc(id) {

function localizar() {
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(
      p => ok({lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), precisao: Math.round(p.coords.accuracy || 0), capturadoEm: new Date(p.timestamp || Date.now()).toISOString()}),
      () => ok(null), {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
  });
}
async function enderecoDe(geo) {
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=${geo.lat}&lon=${geo.lon}`, {signal: ctl.signal});
    clearTimeout(t); if (!r.ok) return '';
    const j = await r.json(), a = j.address || {};
    const rua = [a.road || a.pedestrian || a.footway, a.house_number].filter(Boolean).join(', ');
    const cid = a.city || a.town || a.village || a.municipality || '';
    const curto = [rua, a.suburb || a.neighbourhood || a.quarter, [cid, a['ISO3166-2-lvl4']?.split('-')[1] || a.state].filter(Boolean).join('/'), a.postcode].filter(Boolean).join(' · ');
    return curto || j.display_name || '';
  } catch (e) { return ''; }
}
// Reduz a foto para JPEG (máx. `max` px no maior lado)
function fotoJpeg(src, w, h, max = 1600, q = 0.85) {
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function lerFoto(file, max) {
  return new Promise((ok, falha) => {
    if (!file || !/^image\//.test(file.type)) return falha(new Error('tipo'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { try { ok(fotoJpeg(im, im.naturalWidth, im.naturalHeight, max)); } catch (e) { falha(e); } URL.revokeObjectURL(url); };
    im.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem')); };
    im.src = url;
  });
}

// Escreve um texto dentro de uma caixa do modelo, reduzindo a fonte e quebrando linhas se precisar
function textoNaCaixa(pdf, T, nome, txt) {
  const [pi, x1, y1, x2, y2] = PROPOSTA.caixas[nome], pg = pdf.getPages()[pi];
  const pars = String(txt || '').split(/\r?\n/).map(s => T.limpa(s)).filter((s, i, a) => s || (i && i < a.length - 1));
  if (!pars.some(Boolean)) return;
  const larg = x2 - x1 - 6, alt = y2 - y1 - 2;
  let sz = 9, linhas = [];
  for (; sz >= 5; sz -= 0.5) {
    linhas = pars.flatMap(p => p ? T.quebra(p, T.font, sz, larg) : ['']);
    if (linhas.length * sz * 1.18 <= alt) break;
  }
  const lh = sz * 1.18, cabem = Math.max(1, Math.floor(alt / lh));
  if (linhas.length > cabem) { linhas = linhas.slice(0, cabem); linhas[cabem - 1] = linhas[cabem - 1].replace(/.{0,2}$/, '…'); }
  let y = linhas.length === 1 ? y1 + (y2 - y1 - sz) / 2 + sz * 0.22 : y2 - 1.5 - sz;
  for (const l of linhas) { pg.drawText(l, {x: x1 + 3, y, size: sz, font: T.font, color: T.tinta}); y -= lh; }
}

/* ---------- Assinatura do proponente (no aparelho do corretor) ---------- */
async function ppAssinar(png, ident) {
  const p = state.pp; if (!p) return;
  const r0 = p.id ? S.propostas.get(p.id) : null;
  if (!r0?.proponenteAss && !(await ppSalvar(true))) return toast('Não foi possível salvar a proposta antes de assinar. Verifique a internet.', 'bad');
  p.etapa = 'gerando'; p.travada = true; render();
  try { await comCarregando(() => Promise.all([loadPdfLibForm(), modeloBytes(PROPOSTA)])); }
  catch (e) { p.etapa = ''; p.travada = false; render(); return toast('Não foi possível carregar o modelo. Verifique a internet e tente de novo.', 'bad'); }
  const {data: c1, error} = await sb.rpc('proposta_carimbar_proponente', {p_id: p.id, p_geo: ident.geo, p_identidade: {documento: true, semVerso: !!ident.semVerso, selfieComDocumento: true, aceite: ACEITE_PROPOSTA}});
  if (error || !c1) { p.etapa = ''; p.travada = false; render(); return writeErr(error); }
  const prop = {...c1.data, id: c1.id}, v = prop.campos || p.v, a = prop.proponenteAss;
  try {
    const regDossie = {id: prop.id, cliente: v.nome, cpf: v.cpf_cnpj, imovel: v.imovel || v.ref_imovel, ip: a.ip, geo: a.geo, assinadoLocal: a.assinadoLocal};
    const dossie = blobPdf(await montarDossiePdf(PROPOSTA, regDossie, ident, png, ME, {papel: 'Proponente', aceite: ACEITE_PROPOSTA, linha: 'PROPONENTE'}));
    const hd = await sha256Hex(dossie);
    const pdf = blobPdf(await ppPdfEtapa1(v, png, prop, hd));
    p.doc = {id: prop.id, token: c1.token, cid: prop.corretorId, pdf, dossie, hp: await sha256Hex(pdf), hd};
  } catch (e) { console.error(e); p.etapa = ''; p.travada = false; render(); return toast('Não foi possível gerar os documentos. Tente de novo.', 'bad'); }
  await ppEnviarProponente();
}
async function ppEnviarProponente() {
  const p = state.pp, d = p?.doc; if (!d) return;
  p.etapa = 'enviando'; render();
  try {
    const base = `${d.cid}/propostas/${d.id}`;
    await ppEnviar(`${base}-dossie-proponente.pdf`, d.dossie);
    await ppEnviar(`${base}-${d.token}-proposta.pdf`, d.pdf);
    const {data, error} = await sb.rpc('proposta_finalizar_proponente', {p_id: d.id, p_hash_pdf: d.hp, p_hash_dossie: d.hd});
    if (error) throw error;
    S.propostas.set(d.id, ppReg({id: data.id, data: data.data, status: data.status, token: data.token, token_expira: data.token_expira}));
    PP_CACHE.set(d.id + '|' + data.data.arquivos.atual, d.pdf);
    state.pp = null; state.ct.modelo = null; state.dirty = false; render(); window.scrollTo(0, 0);
    toast('Proposta assinada pelo proponente. Envie o link para o proprietário.');
    ppVer(d.id);
  } catch (e) {
    console.error(e); p.etapa = 'erro'; render();
    toast('A proposta foi assinada, mas não foi salva no servidor. Toque em "Tentar salvar de novo".', 'bad');
  }
}

const PP_CACHE = new Map();
async function ppBaixarArquivo(id, path) {
  const k = id + '|' + path; if (PP_CACHE.has(k)) return PP_CACHE.get(k);
  const {data, error} = await sb.storage.from('contratos').download(path); if (error) throw error;
  const b = data.type === 'application/pdf' ? data : blobPdf(data); PP_CACHE.set(k, b); return b;
}

}

      <ul class="pp-linha">${r.criadoTs ? `<li><b>Criada</b> · ${dataHoraBr(new Date(r.criadoTs).toISOString())}</li>` : ''}${linha('Proponente assinou', r.proponenteAss)}${r.proprietarioAss ? linha(r.acao === 'contraproposta' ? 'Proprietário fez contra-proposta' : 'Proprietário aceitou', r.proprietarioAss) : ''}${linha('Proponente aceitou a contra-proposta', r.aceiteContraAss)}</ul>
      ${ativo ? `<div class="pp-link"><div class="small"><b>${r.status === 'contraproposta' ? 'Link para o proponente aceitar a contra-proposta' : 'Link para o proprietário'}</b> · válido até ${dataHoraBr(r.token_expira)}</div>
        <div class="row" style="gap:8px;margin-top:8px"><input class="input" id="pp-url" readonly value="${esc(ppLink(r.token))}" style="flex:1;min-width:200px">
        <button class="btn" id="pp-copiar">${ic('copy')}Copiar</button><button class="btn wa" id="pp-wa">${ic('whats')}WhatsApp</button><button class="btn" id="pp-mail">${ic('mail')}E-mail</button></div></div>` : ''}

      ${docs.length ? `<div class="seg" role="tablist" style="margin:14px 0 12px;flex-wrap:wrap">${docs.map(([k, l], i) => `<button type="button" data-pp-doc="${k}" aria-pressed="${!i}">${l}</button>`).join('')}</div><div class="ct-pdf" id="pp-pdf"><div class="empty">Carregando o documento…</div></div>` : ''}`,

async function pubAssinar(png, ident) {
  const P = PUBLICO;
  const espera = msg => pubTela(`<section class="card"><div class="card-b"><div class="empty"><b>${msg}</b>Não feche esta página.</div></div></section>`);
  espera('Registrando a assinatura…');
  try {
    await comCarregando(loadPdfLibForm);
    const {data: c, error} = await sb.rpc('proposta_publica_carimbar', {p_token: P.token, p_acao: P.acao, p_geo: ident.geo,
      p_identidade: {documento: true, semVerso: !!ident.semVerso, selfieComDocumento: true, aceite: ACEITE_PROPOSTA}, p_pessoa: P.pessoa, p_contra: P.contra});
    if (error || !c) throw error || new Error('carimbo');
    espera('Gerando os documentos…');
    const a = c.carimbo, papel = P.acao === 'aceite_contra' ? 'Proponente' : 'Proprietário(a)';
    const regDossie = {id: c.id, cliente: a.nome, cpf: a.cpf, imovel: c.campos?.imovel || c.campos?.ref_imovel, ip: a.ip, geo: a.geo, assinadoLocal: a.assinadoLocal};
    const dossie = blobPdf(await montarDossiePdf(PROPOSTA, regDossie, ident, png, {nome: c.corretorNome}, {papel, aceite: ACEITE_PROPOSTA, linha: papel.toUpperCase()}));
    const hd = await sha256Hex(dossie);
    const pdf = blobPdf(await ppPdfEtapa2(await P.pdf.arrayBuffer(), P.acao, c.contra || {}, png, a, hd));
    const hp = await sha256Hex(pdf);
    espera('Enviando…');
    const base = `${c.corretorId}/propostas/${c.id}-${P.token}`;
    await ppEnviar(base + (P.acao === 'aceite_contra' ? '-dossie-proponente-aceite.pdf' : '-dossie-proprietario.pdf'), dossie);
    await ppEnviar(base + (P.acao === 'contraproposta' ? '-contraproposta.pdf' : '-final.pdf'), pdf);
    const {data: f, error: e2} = await sb.rpc('proposta_publica_finalizar', {p_token: P.token, p_hash_pdf: hp, p_hash_dossie: hd});
    if (e2) throw e2;
    P.final = {blob: pdf, nome: `proposta-${slugify(c.campos?.nome || c.id)}-${P.acao === 'contraproposta' ? 'contraproposta' : 'assinada'}.pdf`};
    pubTela(`<section class="card"><div class="card-b stack" style="align-items:center;text-align:center">
      <span class="pill ok">${f.status === 'concluido' ? 'Concluído' : 'Contra-proposta enviada'}</span>
      <p class="ct-texto">${f.status === 'concluido' ? 'Assinatura registrada. A proposta está <b>concluída</b> e o corretor já foi avisado.' : 'Sua contra-proposta foi assinada e enviada. O corretor vai encaminhá-la ao proponente.'}<br><span class="muted small">Assinado em ${carimbo(a).txt} (horário de Brasília).</span></p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="pub-baixar">${ic('download')}Baixar o documento</button></div>
    </div></section>`);
    $('#pub-baixar').onclick = () => baixarDoc(P.final);
  } catch (e) {
    console.error(e);
    pubTela(`<section class="card"><div class="card-b"><div class="empty"><b>Não foi possível concluir a assinatura</b>Verifique a internet e abra o link de novo. Se o problema continuar, fale com o corretor.</div></div></section>`);
  }
}

  'vd-prev': () => { state.vendas.mes = addMonths(state.vendas.mes, -1); render(); },
  'vd-next': () => { state.vendas.mes = addMonths(state.vendas.mes, 1); render(); },
  'vi-venda': el => { const v = S.visitas.get(el.dataset.id); if (v) vendaForm(vendaDeVisita(v)); },
  'rel-tipo': el => { state.rel.tipo = el.dataset.v; render(); },
  'rel-per': el => { relSetPeriodo(el.dataset.v); render(); },
  'rel-prev': () => { relShift(-1); render(); },
  'rel-next': () => { relShift(1); render(); },
  'rel-pdf': el => relExport('pdf', el),
  'rel-print': el => relExport('print', el),
  'rel-airdrop': el => relExport('airdrop', el),
  'me-senha': () => senhaModal(),
  'modal-close': () => closeModal(),
  'modal-bg': (el, e) => { if (e.target === el) closeModal(); },
  // painel
  'dash-tipo': el => { state.dash.tipo = el.dataset.v; render(); },
  'dash-prev': () => { const n = {mes: 1, tri: 3, ano: 12}[state.dash.tipo]; state.dash.ref = addMonths(state.dash.ref, -n); render(); },
  'dash-next': () => { const n = {mes: 1, tri: 3, ano: 12}[state.dash.tipo]; state.dash.ref = addMonths(state.dash.ref, n); render(); },
  // agenda
  'ag-day': el => { state.agenda.sel = el.dataset.d; render(); },
  'ag-prev': () => { shiftMonth(state.agenda, -1); render(); },
  'ag-next': () => { shiftMonth(state.agenda, 1); render(); },
  'ag-today': () => { state.agenda.sel = today(); state.agenda.month = monthKey(today()); render(); },
  'ag-new': () => agendaForm(),
  'ag-edit': el => agendaForm(S.agenda.get(el.dataset.id)),
  'ag-del': el => { const e = S.agenda.get(el.dataset.id); if (e && !canOp(e.corretorId)) return denied(); if (e) confirmBox(`Excluir o compromisso <b>${esc(e.titulo)}</b>?`, 'Excluir', async () => { if (await remove('agenda', e.id)) toast('Compromisso excluído.'); }); },
  'ag-iphone': el => { const e = S.agenda.get(el.dataset.id); if (e) iphoneModal(e); },
  'ag-ics-all': () => { const evs = agendaVisivel(); if (!evs.length) return toast('Não há compromissos para copiar.', 'warn'); copyText(icsText(evs), `${evs.length} compromisso(s) copiados em formato .ics.`); },
  // conhecimento
  'kb-new': () => kbForm(),
  'kb-open': el => { const k = S.conhecimento.get(el.dataset.id); if (k) kbView(k); },
  'kb-edit': el => { const k = S.conhecimento.get(el.dataset.id); if (k) kbForm(k); },
  'kb-del': el => { const k = S.conhecimento.get(el.dataset.id); if (k) confirmBox(`Excluir o card <b>${esc(k.titulo)}</b>?`, 'Excluir', async () => { if (await remove('conhecimento', k.id)) toast('Card excluído.'); }); },
  // treinamentos
  'tr-new': () => trForm(),
  'tr-edit': el => { const t = S.treinamentos.get(el.dataset.id); if (t) trForm(t); },
  'tr-del': el => { const t = S.treinamentos.get(el.dataset.id); if (t) confirmBox(`Excluir o treinamento <b>${esc(t.titulo)}</b>? Os arquivos deixam de aparecer na lista.`, 'Excluir', async () => { if (await remove('treinamentos', t.id)) toast('Treinamento excluído.'); }); },
  // ponto
  'pt-day': el => { state.ponto.sel = el.dataset.d; render(); },
  'pt-prev': () => { shiftMonth(state.ponto, -1); render(); },
  'pt-next': () => { shiftMonth(state.ponto, 1); render(); },
  'pt-today': () => { state.ponto.sel = today(); state.ponto.month = monthKey(today()); render(); },
  'pt-ampm': el => {
    const v = el.dataset.v === 'AM' ? 'PM' : 'AM'; el.dataset.v = el.textContent = v;
    const inp = el.parentNode.querySelector('[data-pt="hora"]'); if (inp && inp.value) inp.dispatchEvent(new Event('change'));
  },
  'pt-st': el => { const cid = el.closest('tr').dataset.cid; const cur = S.ponto.get(state.ponto.sel)?.registros?.[cid]?.status; ptSet(cid, 'status', cur === el.dataset.v ? '' : el.dataset.v); },
  'pt-ordem': () => {
    const iso = state.ponto.sel, reg = JSON.parse(JSON.stringify(S.ponto.get(iso)?.registros || {}));
    const ch = Object.entries(reg).filter(([k, r]) => r.status === 'veio' && r.hora && corretor(k)?.ativo !== false).sort((a, b) => a[1].hora.localeCompare(b[1].hora));
    if (!ch.length) return toast('Marque quem veio e a hora de chegada primeiro.', 'warn');
    ch.forEach(([k], i) => reg[k].roleta = i + 1);
    save('ponto', iso, {data: iso, registros: reg}).then(ok => ok && toast('Roleta numerada pela ordem de chegada.'));
  },
  'vi-new': () => visitaForm(),
  'vi-edit': el => { const v = S.visitas.get(el.dataset.id); if (v) visitaForm(v); },
  'vi-del': el => { const v = S.visitas.get(el.dataset.id); if (v && !canOp(v.corretorId)) return denied(); if (v) confirmBox(`Excluir a visita de <b>${esc(v.cliente)}</b>?`, 'Excluir', async () => { if (await remove('visitas', v.id)) toast('Visita excluída.'); }); },
  // metas
  'mt-prev': () => { state.metasMes = addMonths(state.metasMes, -1); render(); },
  'mt-next': () => { state.metasMes = addMonths(state.metasMes, 1); render(); },
  'mt-copy': () => {
    const prev = S.metas.get(addMonths(state.metasMes, -1)); if (!prev) return toast('O mês anterior não tem metas salvas.', 'warn');
    $('#mt-eq').value = moneyCents(prev.equipe); $$('[data-meta]').forEach(el => el.value = moneyCents(prev.individuais?.[el.dataset.meta] || 0));
    $('#mt-eq').dispatchEvent(new Event('input', {bubbles: true})); state.dirty = true; toast('Valores copiados. Revise e clique em Salvar.');
  },
  'mt-split': () => {
    const eq = parseCents(val('mt-eq')), els = $$('[data-meta]'); if (!eq) return toast('Informe primeiro a meta da equipe.', 'warn'); if (!els.length) return;
    const each = Math.floor(eq / els.length / 1000) * 1000; els.forEach((el, i) => el.value = moneyCents(i === 0 ? r2(eq - each * (els.length - 1)) : each));
    $('#mt-eq').dispatchEvent(new Event('input', {bubbles: true})); state.dirty = true;
  },
  // modelos de contrato
  'ct-abrir': el => { const k = el.dataset.m; if (!MODELOS[k]) return;
    if (MODELOS[k].tipo === 'proposta') { if (!PROPOSTAS_OK) return toast('O banco ainda não tem a estrutura de propostas. Veja o aviso na tela.', 'warn'); ppNova(); state.ct.modelo = k; render(); window.scrollTo(0, 0); return; }
    if (state.ct.modelo !== k) ctLimpar(k); state.ct.modelo = k; render(); window.scrollTo(0, 0); },
  'ct-voltar': () => { if (state.pp) { if (state.pp.pendente) ppSalvar(); state.pp = null; } state.ct.modelo = null; if (state.ct.doc && state.ct.etapa !== 'erro' && state.ct.etapa !== 'enviando') ctLimpar(); state.dirty = false; render(); window.scrollTo(0, 0); },
  'ct-op': el => {
    if (state.ct.doc) return;
    const md = MODELOS[state.ct.modelo], g = ctGrupo(md, el.dataset.g), n = el.dataset.n, v = state.ct.v, on = !v[n];
    if (g.radio && v[n]) return;
    if (g.unico) g.opcoes.forEach(([x]) => { v[x] = false; }); v[n] = on;
    $$(`#view [data-g="${g.g}"]`).forEach(b => { b.setAttribute('aria-pressed', !!v[b.dataset.n]); if (g.radio) b.setAttribute('aria-checked', !!v[b.dataset.n]); });
    if (g.extra) {
      if (!v[g.extra.se]) v[g.extra.n] = '';
      render();
      if (v[g.extra.se]) { const i = $('#ct-' + g.extra.n); if (i) i.focus(); }
    }
  },
  'ct-assinar': () => {
    if (!sb || !CONTRATOS_OK) return toast('O banco ainda não tem a estrutura de contratos. Veja o aviso no topo da tela.', 'warn');
    if (state.ct.doc || state.ct.etapa === 'gerando') return;
    assinaturaModal((png, ident) => ctAssinar(png, ident));
  },
  'ct-exportar': () => { if (state.ct.doc) { baixarDoc(state.ct.doc); toast('PDF salvo.'); } },
  'ct-imprimir': el => state.ct.doc && imprimirDoc(state.ct.doc, el),
  'ct-whats': () => state.ct.doc && whatsappDoc(state.ct.doc),
  'ct-email': () => state.ct.doc && emailDoc(state.ct.doc),
  'ct-reenviar': () => state.ct.doc && ctSalvarArquivo(state.ct.doc),
  'ct-novo': () => {
    const zera = () => { ctLimpar(); render(); window.scrollTo(0, 0); };
    if (state.ct.etapa === 'erro') confirmBox('Este contrato assinado ainda <b>não foi salvo no servidor</b>. Se começar outro agora, use Exportar antes para não perdê-lo. Começar um novo formulário mesmo assim?', 'Novo formulário', async () => zera());
    else zera();
  },
  'ct-ver': el => ctVer(el.dataset.id),
  'pp-ver': el => ppVer(el.dataset.id),
  'pp-editar': el => ppAbrirRascunho(el.dataset.id),
  'pp-salvar': async () => { if (state.pp?.travada) return; if (await ppSalvar(true)) toast('Proposta salva em Propostas realizadas.'); },
  'pp-reenviar': () => ppEnviarProponente(),
  'pp-assinar': () => {
    if (!sb || !PROPOSTAS_OK) return toast('O banco ainda não tem a estrutura de propostas. Veja o aviso na tela.', 'warn');
    if (!state.pp || state.pp.etapa === 'gerando' || state.pp.etapa === 'enviando') return;
    assinaturaModal((png, ident) => ppAssinar(png, ident), {titulo: 'Assinatura do(a) proponente', aceite: ACEITE_PROPOSTA});
  },
  'ct-baixar': async el => {
    el.disabled = true;
    try { baixarDoc(await obterDoc(el.dataset.id)); } catch (e) { toast('Não foi possível baixar o documento. Verifique a internet e tente de novo.', 'bad'); }
    finally { el.disabled = false; }
  },
  // usuários
  'us-novo': () => { state.users.tab = 'form'; state.users.editId = null; render(); },
  'us-lista': () => { state.users.tab = 'lista'; state.users.editId = null; render(); },
  'us-perm': () => { if (!isMaster()) return denied(); state.users.tab = 'perm'; state.users.editId = null; render(); },
  'perm-ov': el => setOverride(el.dataset.k, el.dataset.v),
  'perm-ov-clear': () => setOverride(null),
  'perm-reset': () => { if (!isMaster()) return denied(); confirmBox('Voltar as permissões de Diretor, Coordenador e Corretor para o padrão do sistema? As exceções por usuário continuam.', 'Restaurar', async () => { if (await save('config', 'permissoes', {})) toast('Permissões padrão restauradas.'); }); },
  'us-edit': el => { const c = corretor(el.dataset.id); if (c && !isMaster() && perfilOf(c) === 'master') return denied(); state.users.tab = 'form'; state.users.editId = el.dataset.id; render(); window.scrollTo(0, 0); },
  'us-filtro': el => { state.users.filtro = el.dataset.v; render(); },
  'us-limpar': () => confirmBox('Remover todos os registros de exemplo (corretores, metas, visitas, agenda, cards, treinamentos e assiduidade de exemplo)? Os dados que você cadastrou ficam.', 'Remover exemplos', async () => {
    let n = 0; for (const c of COLS) for (const r of list(c).filter(r => r.exemplo)) { if (await remove(c, r.id)) n++; }
    toast(n + ' registro(s) de exemplo removidos.');
  })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (ACT_PERM[el.dataset.act] && !can(ACT_PERM[el.dataset.act])) return denied();
  if (el.tagName === 'BUTTON' || el.dataset.act === 'modal-bg') { fn(el, e); }
});
document.addEventListener('input', e => { if (e.target.closest('[data-guard]')) state.dirty = true; });

/* ---------- Início ---------- */
(function boot() {
  const tk = new URLSearchParams(location.search).get('proposta');
  if (tk) { pubIniciar(tk); return; }
  const h = location.hash.slice(1); if (VIEWS[h]) state.view = h;
  swRegistrar();
  render();
  initAuth();
})();
</script>
</body>
</html>
